<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro arquivo</title>
    <!--Parte de CSS-->
    <style> 
        body {
            background-color: rgb(55, 55, 158);
            color: white;
            font: normal 20pt Arial;
        }
        h1 {
            color: rgba(218, 218, 32, 0.918);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição</p>
    <!--Parte de JavaScript-->
    <script> 
        window.alert('Minha primeira mensagem'); //Apenas tem a função de alertar//
        window.confirm('Está gostando de javascript?') //Da a opção de ok ou cancelar//
        window.prompt('Qual é o seu nome?')//Da a opção de digitar algo no prompt//
    </script>
</body>
</html>
